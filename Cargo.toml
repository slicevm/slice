[workspace]
resolver = "2"
members = [
    "crates/slice-cas",
    "crates/slice-io",
    "crates/slice-sandbox",
    "crates/slice-engine",
    "crates/slice-cli",
]

[workspace.package]
version = "0.10.7"
edition = "2021"
authors = ["Slice Runtime Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/slicevm/slice"
homepage = "https://github.com/slicevm/slice"
description = "Next-generation microVM-grade JavaScript/TypeScript edge runtime engineered in Rust"

[workspace.dependencies]
blake3 = "1.8"
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
libc = "0.2"
oxc = { version = "=0.152.0", features = ["transformer", "codegen", "semantic"] }
boa_engine = { version = "0.22", default-features = false }
rustc-hash = "2.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ring = "0.17"
webpki-roots = "1.0"
rustls-pki-types = "1"
wasmi = "2.0"
notify = { version = "8.2", default-features = false, features = ["macos_kqueue"] }
memchr = "2.8"
aho-corasick = "1.1"
compact_str = "0.10"
parking_lot = "0.12"
cow-utils = "0.1"
smallvec = { version = "1.16", features = ["union", "const_generics", "const_new"] }
itoa = "1.0"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = false
codegen-units = 16

[patch.crates-io]
boa_engine = { path = "vendor/boa_engine" }

