[workspace]
resolver = "2"
members = [
    "crates/slice-cas",
    "crates/slice-io",
    "crates/slice-sandbox",
    "crates/slice-engine",
    "crates/slice-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Slice Runtime Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
blake3 = "1.5"
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
libc = "0.2"
oxc = { version = "=0.152.0", features = ["transformer", "codegen", "semantic"] }
boa_engine = { version = "0.22", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

