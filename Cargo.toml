[workspace]
resolver = "2"
members = [
    "crates/slice-cas",
    "crates/slice-io",
    "crates/slice-sandbox",
    "crates/slice-engine",
    "crates/slice-cli",
]

[workspace.package]
version = "0.9.7"
edition = "2021"
authors = ["Slice Runtime Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/siktec-lab/slice"
homepage = "https://github.com/siktec-lab/slice"
description = "Next-generation microVM-grade JavaScript/TypeScript edge runtime engineered in Rust"

[workspace.dependencies]
blake3 = "1.5"
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
libc = "0.2"
oxc = { version = "=0.152.0", features = ["transformer", "codegen", "semantic"] }
boa_engine = { version = "0.22", default-features = false }
rustc-hash = "2.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0"
rustls-pki-types = "1"
wasmi = "0.40"
notify = { version = "6.1", default-features = false, features = ["macos_kqueue"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

