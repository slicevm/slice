name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check-and-test:
    name: Check, Clippy & Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check workspace targets
        run: cargo check --workspace --all-targets

      - name: Run Clippy linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace unit tests
        run: cargo test --workspace

  smoke-e2e:
    name: Runtime E2E Smoke Suite (Linux)
    runs-on: ubuntu-latest
    needs: check-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build Slice CLI binary
        run: cargo build --bin slice

      - name: Verify Slice info, doctor, and 5-vector security containment
        run: |
          ./target/debug/slice info
          ./target/debug/slice doctor
          ./target/debug/slice verify-security

      - name: Verify TypeScript static check and CAS packing
        run: |
          ./target/debug/slice inspect ./docker-tests/apps/01-fintech-checkout/src/index.ts
          ./target/debug/slice pack ./docker-tests/apps/01-fintech-checkout /tmp/fintech.cas
          ./target/debug/slice inspect /tmp/fintech.cas
          ./target/debug/slice run /tmp/fintech.cas --metrics

      - name: Verify WinterTC HTTP edge server smoke test
        run: |
          ./target/debug/slice serve ./docker-tests/apps/09-wintertc-web-router --port=18080 --smoke-test

      - name: Verify time-travel deterministic test runner
        run: |
          ./target/debug/slice test ./docker-tests/apps/15-time-travel-test-suite

