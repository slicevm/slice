name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_MIN_STACK: 16777216

jobs:
  check-and-test:
    name: Check, Clippy & Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Verify Rust formatting
        run: cargo fmt --all -- --check

      - name: Check workspace targets
        run: cargo check --workspace --all-targets --locked

      - name: Run Clippy linter
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run workspace unit tests
        run: cargo test --workspace --locked

  smoke-e2e:
    name: Runtime E2E Smoke Suite (Linux)
    runs-on: ubuntu-latest
    needs: check-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build Slice CLI binary
        run: cargo build --locked --bin slice

      - name: Verify Slice info, doctor, 5-vector security containment, and slice init E2E
        run: |
          ./target/debug/slice info
          ./target/debug/slice doctor
          ./target/debug/slice verify-security
          ./target/debug/slice mcp --smoke-test
          ./target/debug/slice init /tmp/slice-init-smoke
          (cd /tmp/slice-init-smoke && "$GITHUB_WORKSPACE/target/debug/slice" run && "$GITHUB_WORKSPACE/target/debug/slice" test)

      - name: Verify TypeScript static check and CAS packing
        run: |
          ./target/debug/slice inspect ./tests/apps/01-fintech-checkout/src/index.ts
          ./target/debug/slice pack ./tests/apps/01-fintech-checkout /tmp/fintech.cas
          ./target/debug/slice inspect /tmp/fintech.cas
          ./target/debug/slice run /tmp/fintech.cas --metrics

      - name: Verify WinterTC HTTP edge server smoke test
        run: |
          ./target/debug/slice serve ./tests/apps/09-wintertc-web-router --port=18080 --smoke-test

      - name: Verify time-travel deterministic test runner and SvelteKit 3 Edge SSR
        run: |
          (cd ./tests/apps/15-time-travel-test-suite && npm install --no-audit --no-fund)
          ./target/debug/slice test ./tests/apps/15-time-travel-test-suite
          (cd ./tests/frameworks/04-sveltekit-edge-ssr && npm install --no-audit --no-fund && npm run build)
          ./target/debug/slice test ./tests/frameworks/04-sveltekit-edge-ssr

      - name: Verify Flagship Case Studies & Workbench (CS 01-05)
        run: |
          for cs in 01-tot-autonomous-sre-agent 02-mcp-code-mode-orchestrator 03-multi-tenant-saas-plugin-mesh 04-wasm-zero-trust-cdr-pipeline 05-time-travel-chaos-fuzzer-payments workbench; do
            (cd "./tests/case_studies/$cs" && npm install --no-audit --no-fund)
          done
          ./target/debug/slice test ./tests/case_studies/01-tot-autonomous-sre-agent --allow-read=/tmp --allow-write=/tmp
          ./target/debug/slice test ./tests/case_studies/02-mcp-code-mode-orchestrator --allow-read=/tmp --allow-write=/tmp
          ./target/debug/slice test ./tests/case_studies/03-multi-tenant-saas-plugin-mesh --allow-read=/tmp --allow-write=/tmp
          ./target/debug/slice test ./tests/case_studies/04-wasm-zero-trust-cdr-pipeline --allow-read=/tmp --allow-write=/tmp
          ./target/debug/slice test ./tests/case_studies/05-time-travel-chaos-fuzzer-payments --allow-read=/tmp --allow-write=/tmp
          ./target/debug/slice serve ./tests/case_studies/workbench --port=18090 --allow-read=/tmp --allow-write=/tmp --smoke-test


